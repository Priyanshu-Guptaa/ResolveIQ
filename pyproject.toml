[project]
name = "resolveiq"
version = "0.1.0"
description = "ResolveIQ -- Investigation Intelligence Platform for L2/L3 Product Support Engineers."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
